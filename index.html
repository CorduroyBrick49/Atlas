<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atlas</title>

        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
            rel="stylesheet"
        />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg: linear-gradient(135deg, #0b0b12, #141427, #1a1330);
                --border: rgba(168, 85, 247, 0.25);
                --text: #ffffff;
                --accent1: #a855f7;
                --accent2: #6366f1;
            }

            /* BODY */
            body {
                font-family: "DM Sans", system-ui, sans-serif;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;

                background: var(--bg);
                color: var(--text);
                overflow: hidden;
            }

            /* SUBTLE BACKGROUND GLOW */
            body::before {
                content: "";
                position: absolute;
                width: 600px;
                height: 600px;
                background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
                filter: blur(100px);
                animation: floatGlow 6s ease-in-out infinite alternate;
            }

            @keyframes floatGlow {
                from {
                    transform: translate(-50px, -50px);
                }
                to {
                    transform: translate(50px, 50px);
                }
            }

            /* TITLE */
            .title {
                font-size: 2.5rem;
                font-weight: 800;
                letter-spacing: 1px;
                opacity: 0.9;
            }

            /* BUTTON */
            .launch-btn {
                position: relative;
                font-size: 2.3rem;
                font-weight: 800;

                padding: 32px 100px;

                border-radius: 20px;
                border: 1px solid var(--border);

                background: linear-gradient(135deg, var(--accent1), var(--accent2));
                background-size: 200% 200%;

                color: var(--text);
                cursor: pointer;

                transition: all 0.3s ease;
                box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);

                overflow: hidden;
            }

            /* ANIMATED GRADIENT */
            .launch-btn {
                animation: gradientShift 4s ease infinite;
            }

            @keyframes gradientShift {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            /* SHINE EFFECT */
            .launch-btn::after {
                content: "";
                position: absolute;
                top: 0;
                left: -75%;
                width: 50%;
                height: 100%;
                background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
                transform: skewX(-25deg);
            }

            .launch-btn:hover::after {
                animation: shine 1s forwards;
            }

            @keyframes shine {
                to {
                    left: 130%;
                }
            }

            /* HOVER */
            .launch-btn:hover {
                transform: translateY(-8px) scale(1.05);
                box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
                filter: brightness(1.15);
            }

            /* CLICK */
            .launch-btn:active {
                transform: scale(0.96);
            }

            /* PULSE (subtle attention grab) */
            .launch-btn {
                animation: pulse 2.5s infinite;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5);
                }
                70% {
                    box-shadow: 0 0 0 25px rgba(168, 85, 247, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(168, 85, 247, 0);
                }
            }
        </style>
    </head>

    <body>
        <div class="title">Atlas is currently down.</div>
        <div class="title">Come back later.</div>

    </body>
</html>
